name: build
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # built-in mirror list (secret, not in the repo): "https://a/;https://b/"
  ELITE_MIRRORS: ${{ secrets.ELITE_MIRRORS }}
  # where "Send logs" uploads to (secret): "https://a;https://b"
  ELITE_LOG_HOSTS: ${{ secrets.ELITE_LOG_HOSTS }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      number: ${{ steps.version.outputs.number }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
      build_ref: ${{ steps.version.outputs.build_ref }}
    steps:
      # A launcher built without these can't reach the mirrors, send logs or update itself: no build at all then.
      - name: Required secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          missing=""
          for k in ELITE_MIRRORS ELITE_LOG_HOSTS TAURI_SIGNING_PRIVATE_KEY; do
            [ -n "$(printenv "$k" | tr -d '[:space:]')" ] || missing="$missing $k"
          done
          if [ -n "$missing" ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            # a pull request from a fork gets no secrets: still a useful build check, it never ships anything
            echo "::warning::No secrets here:$missing - this build can't reach the mirrors, only a check"
          elif [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them in Settings > Secrets and variables > Actions > Repository secrets (not in an environment: the build jobs don't use one)."
            exit 1
          fi
          echo "Required secrets: present"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)"
          tauri="$(python3 -c 'import json; print(json.load(open("app/tauri.conf.json"))["version"])')"
          if [ "$version" != "$tauri" ]; then
            echo "::error::Cargo.toml has $version, app/tauri.conf.json has $tauri: raise both"
            exit 1
          fi
          python3 scripts/release_notes.py check "$version"
          # in a pull request the version must be ahead of the last published release
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" -q .tag_name 2>/dev/null | sed 's/^v//' || true)"
          if [ "$EVENT" = pull_request ] && [ -n "$latest" ] \
             && { [ "$version" = "$latest" ] || [ "$(printf '%s\n%s\n' "$version" "$latest" | sort -V | tail -1)" != "$version" ]; }; then
            echo "::error::version $version is not greater than the last published release $latest — raise it"
            exit 1
          fi
          # on main a new X.Y.0 is the version released to players by hand; the draft below is made for every version
          release=false
          if [ "$REF" = refs/heads/main ] && [ "$EVENT" = push ]; then
            case "$version" in *.0) release=true ;; esac
          fi
          {
            echo "number=$version"
            echo "tag=v$version"
            echo "release=$release"
            echo "build_ref=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "Version **$version** (last published: ${latest:-none})" >> "$GITHUB_STEP_SUMMARY"

  core:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p elite-core -p elite-publish -p elite-cli
      - run: cargo test -p elite-core -p elite-publish -p elite-cli

  launcher:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: "--bundles nsis"
          - os: ubuntu-22.04
            args: "--bundles deb,appimage"
          - os: macos-latest
            args: "--target universal-apple-darwin --bundles app,dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.build_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      # the packages come from the Actions cache (bump `version` when the list changes): the plain apt-get install took up to
      # 22 minutes on a slow Ubuntu mirror (release 1.4.10), from the cache it is about half a minute
      - name: Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev patchelf
          version: 1
      - run: cargo install tauri-cli --version "^2" --locked
      # Self-update artifacts (the installer / AppImage / .deb / .app.tar.gz plus a .sig) are signed with the updater
      # key; the public key goes into the bundler config here, so the repository and local builds don't need it.
      - name: Build
        working-directory: app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # the public key is keys/updater.pub in the repository root, one level up from app/ (the launcher compiles
          # it in too). The self-update asks our mirrors first (Moscow, Germany, rts: fast for the players, they copy
          # every GitHub Release within ~2 min), GitHub's own latest release last.
          # Read into a variable: without the file the step stops here, not after the whole build with an empty key
          pubkey="$(tr -d '[:space:]' < ../keys/updater.pub)"
          printf '{"bundle":{"createUpdaterArtifacts":true},"plugins":{"updater":{"pubkey":"%s","endpoints":["https://dow2ru.fintebtc.de/elite/dl/updater.json","https://dow2.fintebtc.de/elite/dl/updater.json","https://rts.fintebtc.de/elite/dl/updater.json","https://github.com/dow2-launcher/Dow2-elite-launcher/releases/latest/download/updater.json"]}}}' \
            "$pubkey" > "$RUNNER_TEMP/updater.conf.json"
          # on failure the last lines go into the run's annotations: readable without access to the logs
          set -o pipefail
          cargo tauri build ${{ matrix.args }} --config "$RUNNER_TEMP/updater.conf.json" 2>&1 | tee "$RUNNER_TEMP/build.log" || {
            grep -E -i 'error|panicked|failed|incorrect|invalid' "$RUNNER_TEMP/build.log" | grep -v '^warning' | tail -n 8 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: elite-launcher-${{ matrix.os }}
          path: |
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/appimage/*.AppImage
            target/**/release/bundle/dmg/*.dmg
          retention-days: 7
      - name: Normalize installers for deploy
        shell: bash
        env:
          V: ${{ needs.version.outputs.number }}
        run: |
          set -e
          out=deploy; mkdir -p "$out"
          case "${{ runner.os }}" in
            Windows)
              cp target/release/bundle/nsis/*_x64-setup.exe "$out/EliteLauncher-$V-setup.exe"
              cp target/release/bundle/nsis/*_x64-setup.exe.sig "$out/EliteLauncher-$V-setup.exe.sig"
              mkdir -p pz/EliteLauncher
              cp target/release/elite-launcher.exe pz/EliteLauncher/EliteLauncher.exe
              [ -f target/release/WebView2Loader.dll ] && cp target/release/WebView2Loader.dll pz/EliteLauncher/ || true
              (cd pz && 7z a -tzip "../$out/EliteLauncher-$V-windows-portable.zip" EliteLauncher >/dev/null)
              ;;
            Linux)
              cp target/release/bundle/appimage/*_amd64.AppImage "$out/EliteLauncher-$V.AppImage"
              cp target/release/bundle/appimage/*_amd64.AppImage.sig "$out/EliteLauncher-$V.AppImage.sig"
              cp target/release/bundle/deb/*_amd64.deb "$out/elite-launcher_${V}_amd64.deb"
              cp target/release/bundle/deb/*_amd64.deb.sig "$out/elite-launcher_${V}_amd64.deb.sig"
              git ls-files | grep -v private > srcfiles.txt   # tracked-only: не тянуть собранные артефакты в src-зип
              python3 - "$V" <<'PY'
          import sys,zipfile
          V=sys.argv[1]
          fs=[l.strip() for l in open('srcfiles.txt') if l.strip()]
          z=zipfile.ZipFile('deploy/elite-launcher-src-%s.zip'%V,'w',zipfile.ZIP_DEFLATED)
          for f in fs: z.write(f,'elite-launcher-%s/%s'%(V,f))
          z.close()
          PY
              ;;
            macOS)
              app=$(find target -type d -name '*.app' -path '*/bundle/macos/*' | head -1)
              [ -n "$app" ] || app=$(find target -type d -name '*.app' | head -1)
              echo "app bundle: $app"
              ditto -c -k --keepParent "$app" "$out/EliteLauncher-$V-mac.zip"
              # the self-update replaces the whole .app from this archive
              upd=$(find target -name '*.app.tar.gz' -path '*/bundle/macos/*' | head -1)
              cp "$upd" "$out/EliteLauncher-$V-mac.app.tar.gz"
              cp "$upd.sig" "$out/EliteLauncher-$V-mac.app.tar.gz.sig"
              ;;
          esac
          ls -la "$out"
      # Windows: подпись через SignPath Foundation (бесплатно для OSS). Включится, когда в репозитории будут
      # секрет SIGNPATH_API_TOKEN и переменные SIGNPATH_ORGANIZATION_ID / SIGNPATH_PROJECT_SLUG.
      # Only builds that become a GitHub Release are signed: SignPath needs a manual approval for every request.
      - name: Upload unsigned Windows files
        if: matrix.os == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != '' && needs.version.outputs.release == 'true'
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows
          path: |
            deploy/*-setup.exe
            deploy/*-windows-portable.zip
          retention-days: 7
      - name: Sign with SignPath
        if: matrix.os == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != '' && needs.version.outputs.release == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Use the signed Windows files
        if: matrix.os == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != '' && needs.version.outputs.release == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cp -f signed/* deploy/
          # SignPath changed the installer: sign it for the self-update again, over the final file
          cargo tauri signer sign "deploy/EliteLauncher-${{ needs.version.outputs.number }}-setup.exe"
      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-${{ matrix.os }}
          path: deploy/*
          retention-days: 7

  publisher:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p elite-publish -p elite-cli
      - uses: actions/upload-artifact@v4
        with:
          name: elite-publish-${{ matrix.os }}
          path: |
            target/release/elite-publish*
            target/release/elite-cli*
          retention-days: 7

  # Everything a real upload to the mirrors does, against a temporary store and a one-off key. The upload itself is
  # skipped until the mirrors and the real signing key are available to CI.
  publish:
    needs: [version, core, launcher]
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.number }}
    steps:
      - name: Paths
        run: |
          {
            echo "KEYS=$RUNNER_TEMP/keys"
            echo "DIST=$RUNNER_TEMP/dist"
            echo "STORE=$RUNNER_TEMP/store"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.build_ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: elite-launcher-*
          path: ${{ runner.temp }}/dist
      - name: One-off signing key
        run: |
          cargo build -q -p elite-publish
          ./target/debug/elite-publish keygen "$KEYS"
          # the public key is compiled in: rebuild so that `verify` checks against the one-off key
          cp "$KEYS/public.key" keys/public.key
          cargo build -q -p elite-publish
      - name: Publish into a temporary store
        run: |
          ./target/debug/elite-publish version "$DIST" "$STORE" "launcher-$VERSION" "$KEYS/private.key"
          url="https://github.com/${{ github.repository }}/releases/tag/v$VERSION"
          printf '{"schema":1,"launcher_update":{"version":"%s","urls":{"all":"%s"}}}\n' "$VERSION" "$url" > "$STORE/launcher.json"
          ./target/debug/elite-publish sign "$STORE/launcher.json" "$KEYS/private.key"
          ./target/debug/elite-publish verify "$STORE"
      - name: Summary
        run: |
          {
            echo "### Launcher $VERSION: dry-run publish"
            echo '```'
            (cd "$DIST" && find . -type f -printf '%s\t%P\n' | awk -F'\t' '{printf "%10.1f MB  %s\n", $1/1e6, $2}')
            echo '```'
            echo "Store: $(find "$STORE/blobs" -type f | wc -l) blobs, $(du -sh "$STORE" | cut -f1); signatures OK."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload to the mirrors
        run: |
          echo "::notice::Upload to the mirrors skipped: no server access and no real signing key in CI yet"
          echo "Upload to the mirrors: **skipped** (no server access yet)" >> "$GITHUB_STEP_SUMMARY"
      - name: Clean up
        if: always()
        run: |
          rm -rf "$KEYS" "$DIST" "$STORE"
          git checkout -- keys/public.key

  # On a push to main: a published GitHub Release vX.Y.Z - the tag on this commit, the installers, their signatures,
  # updater.json, SHA256SUMS, the source zip, and the changelog as the description. THIS IS THE RELEASE TO THE PLAYERS
  # (owner, 02.11.2026): the GitHub Release is the main source of the launcher. The server (rts, elite-launcher-gh-sync,
  # every 90 s) copies a new release to our mirrors after checking every self-update signature against the updater key
  # pinned on the server, and writes the mirrors' updater.json / latest.json / the update button of 1.2.x - the launchers
  # see the update within ~2 min. Same version as the last release = nothing new is published (raise the version).
  release:
    needs: [version, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: deploy-*
          merge-multiple: true
          path: dist
      - name: Assemble the release
        run: |
          # updater.json of the release points at the release's own files (GitHub = the main source; the mirrors write
          # their own updater.json pointing at their copies)
          python3 scripts/updater_manifest.py "$VERSION" "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" dist > dist/updater.json
          ( cd dist && ls | grep -vE '\.sig$|^SHA256SUMS$|^updater\.json$' | xargs sha256sum > SHA256SUMS )
          { cat "changelog/$VERSION/en.md"; echo; echo "_Built from ${GITHUB_SHA}._"; } > notes.md
          ls -la dist
      - name: Publish the release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::warning::$TAG is already released - raise the version"
            exit 0
          fi
          gh release create "$TAG" dist/* --title "Elite Launcher $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
          echo "Released **$TAG** ($(ls dist | wc -l) files)" >> "$GITHUB_STEP_SUMMARY"
